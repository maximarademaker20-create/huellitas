<div class="{{ clase }}">
  <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if campo.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
  {% for e in campo.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
