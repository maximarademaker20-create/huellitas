{% extends 'usuarios/base_acceso.html' %}
{% block titulo %}Crear cuenta{% endblock %}

{% block formulario %}
<form method="post" action="{% url 'registrar' %}">
  {% csrf_token %}
  <h2 class="titulo-acceso">Crear cuenta del personal</h2>
  <div class="dos-campos">
    <div>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" value="{{ valores.nombre|default:'' }}">
    </div>
    <div>
      <label for="apellido">Apellido</label>
      <input id="apellido" name="apellido" type="text" value="{{ valores.apellido|default:'' }}">
    </div>
  </div>
  <div>
    <label for="username">Usuario <span class="req">*</span></label>
    <input id="username" name="username" type="text" value="{{ valores.username|default:'' }}" required>
  </div>
  <div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ valores.email|default:'' }}">
  </div>
  <div>
    <label for="rol">Rol <span class="req">*</span></label>
    <select id="rol" name="rol" required>
      <option value="">Elegí tu rol</option>
      {% for valor, nombre in roles %}
        <option value="{{ valor }}" {% if valores.rol == valor %}selected{% endif %}>{{ nombre }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="password">Contraseña <span class="req">*</span></label>
    <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" required>
  </div>
  <div>
    <label for="password2">Repetir contraseña <span class="req">*</span></label>
    <input id="password2" name="password2" type="password" required>
  </div>
  {% if errores %}
    <div class="alerta">{% for e in errores %}<div>{{ e }}</div>{% endfor %}</div>
  {% endif %}
  <button class="boton" type="submit">Crear cuenta</button>
  <p class="olvido">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</form>
{% endblock %}
